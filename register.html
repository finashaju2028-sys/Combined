<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Tech Event 2026</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h2>Tech Event 2026</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<div class="container">
    <h1>Register for the Event</h1>
    <form onsubmit="showMessage(event)">
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>
        <input type="text" placeholder="Phone Number" required>
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Prefer not to say</option>
        </select>
        <select required>
            <option value="">Select Event</option>
            <option>Workshop</option>
            <option>Seminar</option>
            <option>Hackathon</option>
            <option>Cultural Event</option>
        </select>
        <button type="submit">Register Now</button>
    </form>
    <p id="message"></p>
</div>

<footer>
    <p>&copy; 2026 Tech Event. All Rights Reserved.</p>
</footer>

<script>
function showMessage(event){
    event.preventDefault();
    document.getElementById('message').innerHTML = "🎉 Registration Successful! See you at the event.";
}
</script>

</body>
</html>
